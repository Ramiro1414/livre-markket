services:

  compras:
    build:
      context: ./compras
      dockerfile: Dockerfile
    container_name: compras
    working_dir: /home/compras
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./compras:/home/compras
    command: sh
    ports:
      - "3000:3000"

  envios:
    build:
      context: ./envios
      dockerfile: Dockerfile
    container_name: envios
    working_dir: /home/envios
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./envios:/home/envios
    command: sh
    ports:
      - "3001:3000"

  infracciones:
    build:
      context: ./infracciones
      dockerfile: Dockerfile
    container_name: infracciones
    working_dir: /home/infracciones
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./infracciones:/home/infracciones
    command: sh
    ports:
      - "3002:3000"

  pagos:
    build:
      context: ./pagos
      dockerfile: Dockerfile
    container_name: pagos
    working_dir: /home/pagos
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./pagos:/home/pagos
    command: sh
    ports:
      - "3003:3000"

  publicaciones:
    build:
      context: ./publicaciones
      dockerfile: Dockerfile
    container_name: publicaciones
    working_dir: /home/publicaciones
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./publicaciones:/home/publicaciones
    command: sh
    ports:
      - "3004:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    working_dir: /home/web
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./web:/home/web
    command: sh
    ports:
      - "8080:3000"
    depends_on:
      - compras

  wso2-mi:
    image: wso2/wso2mi:4.5.0
    container_name: wso2-mi
    restart: always

    ports:
      - "8290:8290"
      - "8253:8253"
      - "9164:9164"

    volumes:
      - ./wso2/logs:/home/wso2carbon/wso2mi-4.5.0/repository/logs
      - ./wso2/carbonapps:/home/wso2carbon/wso2mi-4.5.0/repository/deployment/server/carbonapps