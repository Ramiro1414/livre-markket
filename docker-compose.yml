networks:
  app-network:
    # Define la red llamada "app-network"
    driver: bridge # Usa el controlador por defecto "bridge"

services:

  compras:
    build:
      context: ./compras
      dockerfile: Dockerfile
    container_name: compras
    working_dir: /home/compras
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./compras:/home/compras
    command: sh
    networks:
      - app-network
    ports:
      - "3000:3000"

  envios:
    build:
      context: ./envios
      dockerfile: Dockerfile
    container_name: envios
    working_dir: /home/envios
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./envios:/home/envios
    command: sh
    networks:
      - app-network
    ports:
      - "3001:3000"

  infracciones:
    build:
      context: ./infracciones
      dockerfile: Dockerfile
    container_name: infracciones
    working_dir: /home/infracciones
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./infracciones:/home/infracciones
    command: sh
    networks:
      - app-network
    ports:
      - "3002:3000"

  pagos:
    build:
      context: ./pagos
      dockerfile: Dockerfile
    container_name: pagos
    working_dir: /home/pagos
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./pagos:/home/pagos
    command: sh
    networks:
      - app-network
    ports:
      - "3003:3000"

  publicaciones:
    build:
      context: ./publicaciones
      dockerfile: Dockerfile
    container_name: publicaciones
    working_dir: /home/publicaciones
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./publicaciones:/home/publicaciones
    command: sh
    networks:
      - app-network
    ports:
      - "3004:3000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    working_dir: /home/web
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - ./web:/home/web
    command: sh
    networks:
      - app-network
    ports:
      - "8080:3000"
    depends_on:
      - compras

  startup-rabbit:
    build:
      context: ./startup-rabbit
      dockerfile: Dockerfile
    container_name: startup-rabbit
    working_dir: /home/startup-rabbit
    restart: always
    networks:
      - app-network
    stdin_open: true
    tty: true
    volumes:
      - ./startup-rabbit:/home/startup-rabbit
    command: sh

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    hostname: "rabbit"
    restart: always
    networks:
      - app-network
    ports:
      - "5672:5672" # Puerto de comunicación de RabbitMQ
      - "15672:15672" # Puerto del dashboard de gestión
    environment:
      RABBITMQ_DEFAULT_USER: arys
      RABBITMQ_DEFAULT_PASS: arys
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
